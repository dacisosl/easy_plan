# Firebase App Hosting 설정 — 이 앱을 구글 서버에서 어떻게 돌릴지 적는다.
#
# 왜 Hosting이 아니라 App Hosting인가: 이 앱은 서버가 일을 한다. 한글 파일(.hwpx)을
# 서버에서 조립하고, 성취기준 엑셀을 서버에서 읽고, 로그인 쿠키를 서버에서 검증한다.
# 일반 Hosting은 미리 만들어 둔 파일만 나눠 주는 곳이라 이 일을 맡을 수 없다.

runConfig:
  # 아무도 안 쓸 때는 0대로 내려간다 — 방학 두 달치 요금을 낼 이유가 없다.
  # 대가는 첫 접속이 몇 초 느린 것(콜드 스타트)이다. 학기 중 낮에는 대체로 깨어 있다.
  minInstances: 0
  # 전교 교사가 같은 날 몰려도 이 정도면 넉넉하다. 상한을 두는 건 성능 때문이 아니라
  # 사고(무한 루프·크롤러)로 요금이 튀는 걸 막기 위해서다.
  maxInstances: 3
  concurrency: 40
  cpu: 1
  # 한글 파일 조립(jszip)과 성취기준 엑셀 파싱(xlsx)이 한꺼번에 메모리를 먹는다.
  # 512로는 큰 과목에서 넘칠 수 있어 1024로 둔다.
  memoryMiB: 1024

env:
  # ── 브라우저로 나가는 값 ─────────────────────────────────────
  # 비밀이 아니다. '어느 프로젝트냐'를 가리키는 주소다.
  # BUILD에도 필요하다 — Next.js가 빌드 때 이 값을 화면 코드에 박아 넣는다.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBx37L145oA0O3Ls0hI1bd722FVMseRvfw
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: edit-help.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: edit-help
    availability: [BUILD, RUNTIME]

  # ── 서버만 보는 값 ───────────────────────────────────────────
  # AI 문안용 열쇠. 파일에 적지 않고 Secret Manager에 맡긴다.
  #   firebase apphosting:secrets:set openrouter-api-key
  # RUNTIME만 준다 — 빌드 때는 쓸 일이 없고, 안 주는 쪽이 새어 나갈 길이 하나 적다.
  - variable: OPENROUTER_API_KEY
    secret: openrouter-api-key
    availability: [RUNTIME]
  - variable: OPENROUTER_MODEL
    value: anthropic/claude-sonnet-4.5
    availability: [RUNTIME]

  # 관리자 명단 — 쉼표로 나열한다. 여기 적힌 사람은 승인 없이 바로 관리자이고,
  # 앱 안 '관리자 → 사용자 승인'에서 남을 승인해 줄 수 있다.
  # 데이터베이스에만 두면 첫 관리자를 만들 길이 없어서 설정값으로 둔다.
  - variable: ADMIN_EMAILS
    value: dunaro.gogo@gmail.com
    availability: [RUNTIME]

  # 서비스 계정 키는 여기 없다. 구글 서버 안에서는 컨테이너가 자기 신분증을 이미
  # 들고 있어서(ADC) admin.ts가 그걸 집어 쓴다. 비밀을 안 옮기는 게 가장 안전하다.
